name: Pages

# 每次推到 main：重新构建 Storybook，连同 site/ 下的静态页面一起发布到 GitHub Pages。
# 站点结构：site/ 的内容在根目录，Storybook 在 /storybook/。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 新的一次推送来了就不必把旧的那次发完；但已经在发布中的不打断，免得站点停在半截
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 拼出站点目录
        run: |
          mkdir _site
          cp -r site/. _site/
          npm run build-storybook -- -o _site/storybook

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
