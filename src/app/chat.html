<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <title>AI 生词伙伴 · Lectern</title>
  <link rel="stylesheet" href="popup.css" /><link rel="stylesheet" href="app.css" />
</head>
<body class="vocabulary-chat">
  <header class="phone-chat-header">
    <a href="index.html#words" class="icon-btn" aria-label="返回生词本"><span data-icon="back"></span></a>
    <div><h1>AI 生词伙伴</h1><span>带着读过的语境，练习表达</span></div>
    <button id="chat-history" class="icon-btn" aria-label="查看学习对话记录" data-track="chat.history"><span data-icon="clock"></span></button>
    <button id="chat-new" class="icon-btn" aria-label="新建学习对话" data-track="chat.new"><span data-icon="plus"></span></button>
  </header>
  <main id="chat-main">
    <section class="phone-chat-context"><div class="row between"><span>这次练习的词</span><button id="chat-select" class="text-btn" data-track="chat.words">更换</button></div><div id="chat-words" class="phone-chat-words"></div></section>
    <div id="chat-messages" class="phone-chat-messages" role="log" aria-label="生词学习对话" aria-live="polite" aria-relevant="additions text"></div>
    <div id="chat-starters" class="phone-chat-starters" aria-label="开始或继续练习"></div>
    <p id="chat-status" class="chat-status" role="status"></p>
    <a id="chat-config" href="options.html#model" hidden>前往设置模型连接</a>
  </main>
  <form id="chat-form" class="phone-chat-composer">
    <label class="visually-hidden" for="chat-input">发送学习消息</label><textarea id="chat-input" rows="2" maxlength="1000" placeholder="试着造句，或问问这个词…" disabled></textarea>
    <button id="chat-send" class="primary" type="submit" aria-label="发送消息" disabled><span data-icon="send"></span></button>
    <button id="chat-stop" class="mini" type="button" data-track="chat.stop" hidden>停止</button>
    <span>Enter 发送 · Shift + Enter 换行</span>
  </form>
  <dialog id="chat-picker" class="phone-word-picker" aria-labelledby="picker-title"><div class="row between"><h2 id="picker-title">带上这些词</h2><button id="picker-close" class="icon-btn" aria-label="完成选词"><span data-icon="check"></span></button></div><p>从生词本选择 1–3 个词</p><input id="picker-search" type="search" placeholder="搜索生词或释义" aria-label="搜索可练习的生词" /><div id="picker-list"></div><p id="picker-count" role="status"></p></dialog>
  <dialog id="chat-history-dialog" class="chat-history-dialog" aria-labelledby="history-title"><div class="row between"><h2 id="history-title">学习对话</h2><button id="history-close" class="icon-btn" aria-label="关闭对话记录">×</button></div><p class="phone-chat-history-note">保存在本机的最近 20 次练习</p><div id="chat-history-list"></div></dialog>
  <script src="chat.js"></script>
</body>
</html>
