<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Lectern</title><link rel="stylesheet" href="popup.css" /></head>
<body class="extension-popup">
  <header class="popup-brand"><a id="open-home" class="brand" href="#"><span data-icon="book"></span><span class="brand-name">Lectern</span></a><button id="open-options" class="icon-btn" aria-label="Open settings" title="Settings"><span data-icon="settings"></span></button></header>
  <nav class="popup-tabs" role="tablist" aria-label="Extension features">
    <button id="tab-focus" class="tab is-active" data-tab="current" role="tab" aria-selected="true" aria-controls="panel-current"><span data-icon="clock"></span>Focus</button>
    <button id="tab-translation" class="tab" data-tab="translation" role="tab" aria-selected="false" aria-controls="panel-translation" tabindex="-1"><span data-icon="words"></span>Translate</button>
  </nav>
  <section id="panel-current" class="popup-body" role="tabpanel" aria-labelledby="tab-focus"></section>
  <section id="panel-translation" class="popup-body" role="tabpanel" aria-labelledby="tab-translation" hidden></section>
  <footer class="popup-footer"><a id="open-dashboard" href="#"><span><span data-icon="chart"></span><span id="dashboard-label">View all statistics</span></span><span data-icon="arrow"></span></a></footer>
  <script src="popup.js"></script>
</body>
</html>
