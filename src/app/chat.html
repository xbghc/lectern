<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <title>Vocabulary Chat · Lectern</title>
  <link rel="stylesheet" href="popup.css" /><link rel="stylesheet" href="app.css" />
</head>
<body class="vocabulary-chat">
  <header class="phone-chat-header">
    <a href="index.html#words" class="icon-btn" aria-label="Back to vocabulary"><span data-icon="back"></span></a>
    <div><h1>Vocabulary chat</h1><span>Practice with the words you have read</span></div>
    <button id="chat-history" class="icon-btn" aria-label="View practice history" data-track="chat.history"><span data-icon="clock"></span></button>
    <button id="chat-new" class="icon-btn" aria-label="New practice chat" data-track="chat.new"><span data-icon="plus"></span></button>
  </header>
  <main id="chat-main">
    <section class="phone-chat-context"><div class="row between"><span>Words for this practice</span><button id="chat-select" class="text-btn" data-track="chat.words">Change</button></div><div id="chat-words" class="phone-chat-words"></div></section>
    <div id="chat-messages" class="phone-chat-messages" role="log" aria-label="Vocabulary practice chat" aria-live="polite" aria-relevant="additions text"></div>
    <div id="chat-starters" class="phone-chat-starters" aria-label="Start or continue practicing"></div>
    <p id="chat-status" class="chat-status" role="status"></p>
    <a id="chat-config" href="options.html#model" hidden>Set up your model connection</a>
  </main>
  <form id="chat-form" class="phone-chat-composer">
    <label class="visually-hidden" for="chat-input">Send practice message</label><textarea id="chat-input" rows="2" maxlength="1000" placeholder="Try a sentence, or ask about a word…" disabled></textarea>
    <button id="chat-send" class="primary" type="submit" aria-label="Send message" disabled><span data-icon="send"></span></button>
    <button id="chat-stop" class="mini" type="button" data-track="chat.stop" hidden>Stop</button>
    <span>Enter to send · Shift + Enter for a new line</span>
  </form>
  <dialog id="chat-picker" class="phone-word-picker" aria-labelledby="picker-title"><div class="row between"><h2 id="picker-title">Choose your words</h2><button id="picker-close" class="icon-btn" aria-label="Done"><span data-icon="check"></span></button></div><p>Choose 1–3 words from your vocabulary</p><input id="picker-search" type="search" placeholder="Search words or meanings" aria-label="Search words to practice" /><div id="picker-list"></div><p id="picker-count" role="status"></p></dialog>
  <dialog id="chat-history-dialog" class="chat-history-dialog" aria-labelledby="history-title"><div class="row between"><h2 id="history-title">Practice history</h2><button id="history-close" class="icon-btn" aria-label="Close practice history">×</button></div><p class="phone-chat-history-note">Your latest 20 practices, saved on this device</p><div id="chat-history-list"></div></dialog>
  <script src="chat.js"></script>
</body>
</html>
