name: Release

# main 每次更新都发布可安装的 preview；v* 标签继续发布正式版并提交商店审核。
# 两个渠道使用同一份 Android 签名，并按此工作流的运行序号递增 versionCode。
#
# APK 默认是 debug 签名的——runner 每次生成的 debug 密钥都不一样，手机上装第二个版本
# 得先卸载第一个。仓库里配了四个 Secret（见 README「持续集成与发布」）时改出正式签名的包。

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    outputs:
      preview: ${{ steps.version.outputs.preview }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Select release version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const base = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+$/.test(base)) throw new Error('package.json must use a stable three-part version');
          const run = Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isSafeInteger(run) || run < 1 || run > 2_099_000_000) throw new Error('Invalid release run number');
          const preview = process.env.GITHUB_REF === 'refs/heads/main';
          if (!preview && process.env.GITHUB_REF !== `refs/tags/v${base}`) {
            throw new Error('Run on main for a preview, or on the v* tag matching package.json for a stable release');
          }
          const [major, minor, patch] = base.split('.').map(Number);
          const version = preview ? `${major}.${minor}.${patch + 1}-preview.${run}` : base;
          const tag = `v${version}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `preview=${preview}\ntag=${tag}\n`);
          appendFileSync(process.env.GITHUB_ENV, [
            `IS_PREVIEW=${preview}`, `RELEASE_TAG=${tag}`,
            `LECTERN_VERSION_NAME=${version}`, `LECTERN_VERSION_CODE=${1_000_000 + run}`, '',
          ].join('\n'));
          NODE

      - run: npm ci
      - run: npm run check

      - name: Package extension
        run: (cd dist && zip -qr "../lectern-extension-${RELEASE_TAG}.zip" .)

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      # 停在 v5：v6 起缓存那部分被拆成闭源的 gradle-actions-caching，升上去等于接受
      # Gradle 的商业使用条款——那是另一个性质的决定，不该顺手做掉。
      - uses: gradle/actions/setup-gradle@v5

      - name: Release-signed APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$FS_KEYSTORE_FILE"
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "../lectern-${RELEASE_TAG}.apk"

      - name: Debug-signed APK
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          ./gradlew assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk "../lectern-${RELEASE_TAG}-debug.apk"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" lectern-*.zip lectern-*.apk
          else
            args=()
            if [ "$IS_PREVIEW" = "true" ]; then
              args+=(--prerelease --latest=false)
              printf 'Preview from main, commit %s.\n\nInstall the APK to try the latest changes. Preview installations check for subsequent preview updates.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/preview-notes.md"
              args+=(--notes-file "$RUNNER_TEMP/preview-notes.md")
            fi
            gh release create "$RELEASE_TAG" lectern-*.zip lectern-*.apk \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes "${args[@]}"
          fi

  # GitHub Release 发完之后，把同一个 zip 传到 Chrome 应用商店并提交审核。没配凭据时那边自己跳过。
  # 单独一个 job：商店那头失败（多半是上一版还在审）不影响上面已经发出去的 Release 和 APK，
  # 之后在 Actions 页面对这个标签手动重跑 Chrome Web Store 工作流即可。
  store:
    name: Chrome Web Store
    needs: release
    if: needs.release.outputs.preview == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/store.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

