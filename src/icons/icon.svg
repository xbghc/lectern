<!--
  读书台：一本翻开的书搁在台子上，书页上四行字，每一行都和书页顶边平行（同一条曲线截掉两头再下移）。
  颜色取自个人设计系统（shadcn Neutral 黑白灰）：底是 primary，书是 primary-foreground，字行是 muted-foreground，台子是 ring 那一档灰。
  这份出 48 和 128 像素。字行缩小了会糊，所以小尺寸另有两份：icon-32.svg 只留两行，icon-16.svg 不画字行。
  三份的书和台子是同一组路径，改形状要一起改，然后跑 scripts/make-icons.sh 重新出 PNG；安卓那份在 ic_launcher_foreground.xml。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#171717"/>
  <path fill="#FAFAFA" d="M60 30C46 20 30 18 16 22V66C30 62 46 64 60 74zM68 30C82 20 98 18 112 22V66C98 62 82 64 68 74z"/>
  <path fill="none" stroke="#737373" stroke-width="3" stroke-linecap="round" d="M24.6 29.3C34.0 28.4 43.8 30.0 53.1 34.8M103.4 29.3C94.0 28.4 84.2 30.0 74.9 34.8M24.6 38.3C34.0 37.4 43.8 39.0 53.1 43.8M103.4 38.3C94.0 37.4 84.2 39.0 74.9 43.8M24.6 47.3C34.0 46.4 43.8 48.0 53.1 52.8M103.4 47.3C94.0 46.4 84.2 48.0 74.9 52.8M24.6 56.3C34.0 55.4 43.8 57.0 53.1 61.8M90.0 56.8C84.9 57.6 79.8 59.3 74.9 61.8"/>
  <path fill="#A1A1A1" d="M24 84h80v8H70v12h18v8H40v-8h18V92H24z"/>
</svg>
