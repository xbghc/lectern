<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 告诉 WebView 页面自带暗色样式，别用算法反色 -->
    <meta name="color-scheme" content="light dark" />
    <title>Lectern</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body class="dash app">
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="app-sidebar reading-header">
      <div class="app-heading"><button id="reading-back" class="icon-btn" aria-label="Back to reading home" title="Back to reading" hidden><span data-icon="back"></span></button><h1 id="app-page-title">Reading</h1></div>
      <nav aria-label="Main navigation">
        <button data-tab="articles" class="tab active"><span data-icon="book"></span><span>Reading</span></button>
        <button data-tab="words" class="tab"><span data-icon="words"></span><span>Vocabulary</span><span id="nav-word-count" class="nav-count"></span></button>
        <a id="to-options" href="options.html" class="phone-nav-link" aria-label="Settings" title="Settings"><span data-icon="settings"></span></a>
      </nav>
    </header>
    <div class="workspace-bar"><div class="breadcrumb"><span id="workspace-title">Reading</span></div><button id="show-books" class="icon-btn" aria-label="Open bookshelf" title="Bookshelf"><span data-icon="shelf"></span></button><button id="workspace-search" class="icon-btn" aria-expanded="false" aria-controls="article-tools" aria-label="Search articles" title="Search articles"><span data-icon="search"></span></button><button id="reading-statistics" class="icon-btn" aria-label="View reading statistics" title="Reading statistics"><span data-icon="chart"></span></button><button id="import-book" class="icon-btn" type="button" aria-label="Import EPUB" title="Import EPUB" hidden><span data-icon="plus"></span></button><a id="words-chat" href="chat.html" class="icon-btn phone-chat-entry" aria-label="Practice vocabulary with AI" title="Practice vocabulary with AI" data-track="chat.open" hidden><span data-icon="chat"></span></a></div>
    <main id="main" class="dashboard-main">


    <!-- ---------------- 文章 ---------------- -->
    <section id="pane-articles" class="pane">

      <div id="reading-metrics" hidden></div>
      <div class="reading-layout"><div class="reading-main">
      <div id="continue-reading"></div>
      <details id="article-tools" class="queue-tools"><summary hidden>Filter and manage articles</summary>
      <div class="article-controls">
      <div id="article-search" class="toolbar article-search">
        <div id="finish-filter" class="filterbar" role="group" aria-label="Filter by reading status">
          <button type="button" data-filter="" aria-pressed="true">All</button>
          <button type="button" data-filter="reading" aria-pressed="false">In progress</button>
          <button type="button" data-filter="done" aria-pressed="false">Finished</button>
        </div>
        <span id="article-summary" class="muted small"></span>
        <!-- 搜索平时收成一个键：用得少，不该常年占着一整行。框在键的左边展开，键不挪位置，再点一下就收 -->
        <div id="search-box" class="search-box">
          <input id="q-article" type="search" placeholder="Search titles or domains" aria-label="Search titles or domains" autocomplete="off" inert />
          <button id="search-toggle" type="button" class="mini" aria-label="Search articles" title="Search articles" aria-expanded="false" aria-controls="q-article">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg>
          </button>
        </div>
      </div>
      <div id="article-actions" class="article-actions" hidden>
        <label class="selection-toggle" title="Select all results"><input id="select-articles" type="checkbox" aria-label="Select all results" /></label>
        <span id="selection-count" class="muted small">0 selected</span>
        <button id="delete-articles" class="action-delete icon-btn" aria-label="Delete selected articles" title="Delete selected articles" disabled><span data-icon="trash"></span></button>
        <button id="classify-articles" aria-label="Filter selected articles with AI" disabled>AI filter</button>
        <button id="suggest-blacklist" disabled>Blocklist suggestions</button>
      </div>
      <button id="manage-articles" class="icon-btn" aria-label="Select articles" title="Select articles" aria-pressed="false"><span data-icon="select"></span></button>
      </div>
      <p id="article-action-status" class="muted small" role="status"></p>
      <section id="classification-panel" class="classification-panel" hidden aria-label="AI article filter">
        <div class="classification-heading"><strong>Filter results</strong><span class="muted small">Classifies pages only · Never deletes automatically</span></div>
        <p id="classification-progress" role="status" aria-live="polite"></p>
        <div class="toolbar">
          <button id="select-nonarticles" disabled>Select non-articles</button>
          <button id="retry-classification" disabled>Retry failed</button>
          <button id="stop-classification" hidden>Stop new requests</button>
        </div>
      </section>
      <details id="blacklist-section" class="blacklist-section" hidden><summary>Suggested URL blocks</summary><div id="blacklist-suggestions"></div></details>
      </details>
      <div id="articles" class="list"></div>
      <div class="list-view-controls" hidden role="group" aria-label="Article view"><button data-view="list" class="icon-btn" aria-label="List view" title="List view" aria-pressed="true"><span data-icon="list"></span></button><button data-view="grid" class="icon-btn" aria-label="Grid view" title="Grid view" aria-pressed="false"><span data-icon="grid"></span></button></div>
      </div><aside id="reading-rail" class="reading-rail" aria-label="Reading and review"></aside></div>
    </section>

    <!-- ---------------- 复习 ---------------- -->
    <section id="pane-review" class="pane" hidden>
      <button id="review-back" class="text-btn"><span data-icon="back"></span>Back to vocabulary</button>
      <div class="segbar">
        <button class="seg active" data-queue="words">Vocabulary<span id="seg-words-n" class="n"></span></button>
        <button class="seg" data-queue="articles">Articles <span id="seg-articles-n" class="n"></span></button>
      </div>
      <div id="review-stats" class="statbar"></div>
      <div class="review-actions"><button id="review-undo" class="mini" type="button" hidden>Undo last rating</button><p id="review-action-status" class="muted small" role="status" aria-live="polite"></p></div>
      <div id="review-area"></div>
    </section>

    <!-- ---------------- 生词本 ---------------- -->
    <section id="pane-words" class="pane" hidden>
      <button id="words-review" class="phone-review-entry"><span data-icon="review"></span><span><strong><span id="due-badge">0</span> items due</strong><small>Revisit words in the context you read them</small></span><span data-icon="arrow"></span></button>
      <div class="toolbar">
        <input id="q-word" type="search" placeholder="Search text, translations or sources" aria-label="Search vocabulary" />
        <select id="kind-filter">
          <option value="">All types</option>
          <option value="word">Word</option>
          <option value="phrase">Phrase</option>
          <option value="sentence">Sentence</option>
        </select>
        <span id="word-summary" class="muted small"></span>
      </div>
      <div id="words" class="list"></div>
    </section>

    <section id="pane-stats" class="pane" hidden><div id="statistics"></div></section>
    <section id="pane-books" class="pane" hidden>
      <p id="book-status" class="muted small" role="status"></p>
      <div id="book-empty" class="empty" hidden><p>Your bookshelf is empty.</p><button id="import-book-empty" type="button" class="primary" hidden>Import EPUB</button><p id="book-open-hint" class="muted small">Open an EPUB with Lectern to start reading.</p></div>
      <section id="book-section" aria-label="Books" hidden>
        <div id="book-list" class="list"></div>
      </section>
</section>
    </main>
    <dialog id="article-dialog" class="article-dialog" aria-labelledby="add-title">
      <div class="dialog-heading"><h2 id="add-title">Add an article</h2><button id="close-add" class="icon-btn" type="button" aria-label="Close add article" title="Close"><span data-icon="close"></span></button></div>
      <form id="add" class="addrow"><input id="add-url" type="url" inputmode="url" placeholder="Paste article URL" aria-label="Article URL" autocomplete="off" required /><button id="add-go" type="submit" class="primary">Read</button></form>
      <p id="add-hint" class="muted small" role="status" hidden></p>
    </dialog>

    <script src="index.js"></script>
  </body>
</html>
